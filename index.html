<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><meta name="description" content="STRONGER 2.0 workout tracker"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg" type="image/svg+xml"><title>STRONGER 2.0</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#171b24;--panel2:#202633;--accent:#b8f34a;--muted:#9aa3b2;--line:#2b3341;--danger:#ff7070}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f7fa;font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 15px;font-weight:750}.app{max-width:760px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(88px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;padding:22px 2px 20px}.brand{font-weight:950;letter-spacing:3px;color:var(--accent);font-size:20px}.tag{font-size:10px;letter-spacing:2px;color:var(--muted)}.version{margin-left:auto;color:var(--accent);font-size:22px;font-weight:900}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:800}.hero{font-size:30px;font-weight:850;margin:5px 0 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0 24px}.stat,.card{background:var(--panel);border:1px solid #202632;border-radius:17px;padding:15px}.stat small{display:block;color:var(--muted);font-size:9px;letter-spacing:1px;font-weight:800}.stat strong{display:block;color:var(--accent);font-size:25px;margin-top:3px}.section{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}.section h3{font-size:12px;letter-spacing:1.8px;color:var(--muted);margin:0}.link{background:none;color:var(--accent);padding:6px}.primary{background:var(--accent);color:#11170b}.secondary{background:var(--panel2);color:#f5f7fa}.danger{background:#3a2025;color:#ff9b9b}.routine{margin:10px 0}.focus{font-size:10px;letter-spacing:1.4px;color:var(--accent);font-weight:800}.rname{font-size:21px;font-weight:850;margin:5px 0}.sub{font-size:12px;color:var(--muted)}.actions{display:flex;gap:9px;margin-top:14px;align-items:center}.actions button{flex:1}.nav{position:fixed;z-index:4;bottom:0;left:0;right:0;background:#151923ee;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:9px max(12px,calc((100vw - 720px)/2)) calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr)}.nav button{background:transparent;color:var(--muted);padding:9px 5px}.nav button.active{color:var(--accent)}.nav span{display:block;font-size:11px;margin-top:3px}.nav b{font-size:19px}.view{display:none}.view.active{display:block}.field{width:100%;background:#10141c;border:1px solid var(--line);border-radius:11px;color:white;padding:12px;margin:5px 0 12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.exercise-row{padding:12px 0;border-bottom:1px solid var(--line)}.exercise-row:last-child{border:0}.muted{color:var(--muted)}.modal{position:fixed;inset:0;background:#000a;z-index:8;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(100%,600px);max-height:90dvh;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 16px}.close{float:right;background:var(--panel2);color:white}.timer{background:var(--accent);color:#10150b;border-radius:18px;text-align:center;padding:18px;margin:18px 0}.timer strong{font-size:48px;display:block;line-height:1.2}.timer button{background:#91c52f;color:#10150b;margin:6px}.bigbtn{width:100%;margin-top:12px}.empty{padding:24px;text-align:center;color:var(--muted)}.install{display:none;background:#28331d;color:var(--accent);padding:12px;border-radius:12px;margin:12px 0}.install.show{display:block}
</style></head><body><main class="app"><header class="top"><div><div class="brand">STRONGER</div><div class="tag">TRAIN WITH INTENT.</div></div><div class="version">2.0</div></header><div id="install" class="install">Install STRONGER on your phone for an app-like experience. <button class="link" id="installBtn">INSTALL</button></div>
<section id="home" class="view active"><div class="eyebrow">YOUR TRAINING</div><div class="hero">Let's get stronger.</div><div class="stats" id="homeStats"></div><div class="section"><h3>QUICK START</h3><button class="link" data-go="routines">See all →</button></div><div id="quickRoutines"></div><div class="section"><h3>COACH'S NOTE</h3></div><div class="card sub" id="coach"></div></section>
<section id="routines" class="view"><div class="section"><h2 style="margin:0">Your routines</h2><button class="primary" id="addRoutine">＋ ADD</button></div><div id="routineList"></div></section>
<section id="progress" class="view"><div class="hero">Your progress</div><p class="sub">Every session counts. Keep building consistency.</p><div class="stats" id="progressStats"></div><div class="section"><h3>RECENT WORKOUTS</h3></div><div id="history"></div></section>
<section id="session" class="view"><button class="link" id="exitSession">← EXIT WORKOUT</button><div class="eyebrow" style="margin-top:15px">WORKOUT IN PROGRESS</div><div class="hero" id="sessionName"></div><div class="sub" id="sessionMeta"></div><div class="card" style="margin-top:20px"><div class="focus">CURRENT EXERCISE</div><h2 id="exerciseName"></h2><div class="sub" id="exerciseMeta"></div><div class="grid2" style="margin-top:16px"><label class="sub">Weight (kg)<input class="field" id="weight" type="number" inputmode="decimal" value="20" step="0.5"></label><label class="sub">Reps<input class="field" id="reps" type="number" inputmode="numeric" value="10"></label></div><div class="sub" id="setMeta"></div><button class="primary bigbtn" id="logSet">LOG SET & CONTINUE</button></div><div id="restBox"></div><p class="sub" id="setsDone"></p></section>
</main><nav class="nav"><button class="active" data-go="home"><b>⌂</b><span>Home</span></button><button data-go="routines"><b>▤</b><span>Routines</span></button><button data-go="progress"><b>▥</b><span>Progress</span></button></nav>
<div class="modal" id="routineModal"><div class="sheet"><button class="close" data-close>✕</button><h2>New routine</h2><label class="sub">ROUTINE NAME<input class="field" id="newName" placeholder="e.g. Push day"></label><label class="sub">FOCUS<input class="field" id="newFocus" placeholder="e.g. CHEST · SHOULDERS · TRICEPS"></label><label class="sub">EXERCISES (one per line)<textarea class="field" id="newExercises" rows="5" placeholder="Bench Press\nShoulder Press\nTriceps Pushdown"></textarea></label><button class="primary bigbtn" id="saveRoutine">CREATE ROUTINE</button></div></div>
<script src="app.js"></script></body></html>
